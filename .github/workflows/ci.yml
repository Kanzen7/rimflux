name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --bin rimflux
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          ./target/release/rimflux --help
          tar -czf rimflux-linux-x86_64.tar.gz -C target/release rimflux
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rimflux-linux-x86_64
          path: rimflux-linux-x86_64.tar.gz
          if-no-files-found: error
      # Compilation/tests do not establish native compositor or Win32 acceptance.
