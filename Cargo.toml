[package]
name = "rimflux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native, top-edge desktop companion built with Rust and iced"
publish = false

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "canvas", "tokio", "wayland", "x11"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "network"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
iced_layershell = { version = "0.19.1", default-features = false }
wayland-client = "0.31.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
